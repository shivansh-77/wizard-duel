<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizard Duel</title>
    <style>
      /* The canvas fills the whole window: no margins, no scrollbars. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Stops the browser from scrolling/zooming when the canvas is touched (phones later). */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
